name: Build

on:
  push:
    branches:
      - '1.20.1-1.1.0'
      - '1.21.1-1.1.0'
      - '1.21.1-1.1.1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Renomear jar
        run: |
          mkdir -p dist
          JAR=$(ls build/libs/*.jar | grep -vE -- '-(sources|javadoc)\.jar$' | head -n1)
          echo "Jar gerado pelo Gradle: $JAR"
          cp "$JAR" "dist/AtomicAdditions-${{ github.ref_name }}.jar"
          ls -la dist

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: AtomicAdditions-${{ github.ref_name }}
          path: dist/*.jar
          if-no-files-found: error
